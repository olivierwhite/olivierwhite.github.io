# Selected papers at the top of the Publications page.
# "citation" is shown as written (*asterisks* = italics); "why" is the one-line comment.
# The DOI link is added automatically when the title matches an entry of content/publications.md.
- citation: "White O & Diedrichsen J (2010). Responsibility assignment in redundant systems. *Current Biology* 20(14):1290–1295."
  title: Responsibility assignment in redundant systems
  why: How the nervous system shares corrections across a redundant body.
- citation: "Diedrichsen J, White O, Newman D, Lally N (2010). Use-dependent and error-based learning of motor behaviors. *Journal of Neuroscience* 30(15):5159–5166."
  title: Use-dependent and error-based learning of motor behaviors
  why: Separates learning from repetition and learning from error.
- citation: "White O, Gaveau J, Bringoux L, Crevecoeur F (2020). The gravitational imprint on sensorimotor planning and control. *Journal of Neurophysiology* 124(1):4–19."
  title: The gravitational imprint on sensorimotor planning and control
  why: Review of how gravity shapes motor planning.
- citation: "Rousseau C, Barbiero M, Pozzo T, Papaxanthis C, White O (2020). Actual and imagined movements reveal a dual role of the insular cortex for motor control. *Cerebral Cortex*."
  title: Actual and imagined movements reveal a dual role of the insular cortex for motor control
  why: fMRI evidence for two insular roles in processing gravity.
- citation: "Kunavar T, Jamšek M, Barbiero M, Blohm G, Nozaki D, Papaxanthis C, Babič J, White O (2021). Effects of local gravity compensation on motor control during altered environmental gravity. *Frontiers in Neural Circuits* 15:750267."
