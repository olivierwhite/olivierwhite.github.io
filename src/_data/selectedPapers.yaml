  why: Stress and gravity act jointly on rhythmic movement.
- citation: "Goswami N, Blaber A, Valenti G, Hinghofer-Szalkay H, Evans J, Bailey D, Vernikos J, Chouker A, Green DA, White O, van Loon JJWA, Convertino VA (2026). Gravity, microgravity, and artificial gravity: physiological effects, implementation, and applications. *Physiological Reviews* 106(2):750–839."
  title: "Gravity, microgravity, and artificial gravity: physiological effects, implementation, and applications"
  why: Reference review; sensorimotor sections.
- citation: "White O (2026). Crosstalk between auditory and visual information in motor learning and savings. *European Journal of Neuroscience* 63(7):e70502."
