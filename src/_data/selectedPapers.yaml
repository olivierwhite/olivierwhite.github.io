  why: A robot restoring Earth-like gravity at the hand during parabolic flight.
- citation: "White O, Dehouck V, Boulanger N, Dierick F, Babič J, Goswami N, Buisseret F (2024). Resonance tuning of rhythmic movements is disrupted at short time scales: a centrifuge study. *iScience* 27(5)."
